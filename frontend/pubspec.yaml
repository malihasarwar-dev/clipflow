name: clipflow
description: ClipFlow - AI-powered YouTube Shorts clipper (Flutter Web).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  http: ^1.2.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  video_player: ^2.8.7
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
